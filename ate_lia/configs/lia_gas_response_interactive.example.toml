# Example config for: python sources/main.py --experiment lia_gas_response_interactive --config configs/lia_gas_response_interactive.example.toml
#
# A manually-gated continuous capture at a fixed operating point. After the
# initial Enter press starts recording, every further Enter press marks the
# current row (mark_label_prefix + an incrementing number, e.g. "mark_1",
# "mark_2", ...) without stopping the capture, and pressing Esc stops
# recording and moves straight into plotting/analysis.
#
# Flow: after configuring the LIA/SCU bias, setting the heater temperature,
# and settling, the operator:
#   1. presses Enter to begin measurement (sampling starts immediately,
#      continuously)
#   2. presses Enter any number of times, whenever a portion (e.g. gas
#      inserted/removed) should be marked
#   3. presses Esc to stop recording and start analysis
# Writes one continuous CSV (Results/LIAMeasurementSetup/<session_folder>/
# gas_response.csv) with index/event columns, and a time-series plot with
# every marked event shown as its own vertical line.
#
# The reference phase is always set literally to 0 deg (never auto-phased).
# All ATE (ESD/fan/heaters) are live from the very start via [ate] below.

[ate]
debug_device_io = true

[ate.heater1]
voltage = 2.9
current = 0.5

[ate.heater3]
voltage = 2.9
current = 0.5

[experiment]
# Heater ch1/ch3 voltage (V), applied to both channels simultaneously.
temperature = 2.9
lia_frequency = 218.0

settle = 60.0            # wait after temperature, before the first Enter prompt
sample_interval = 0.5

session_folder = "sample_140_100ppmbottle_non-opt-oppoint_fifth_run"   # subfolder under Results/LIAMeasurementSetup/; omit for a date-stamped name

# Prefix for the CSV event column / plot legend of each mark: "mark_1",
# "mark_2", etc.
mark_label_prefix = "mark"

# Explicit SCU1/SCU2 starting bias. Comment both out to fall back to starting
# from v_scu1/v_scu2 below instead.
# v_scu1_start = 0.84
# v_scu2_start = 0.84

v_scu1 = 3.10
v_scu2 = 3.10
scu_compliance = 1e-4
offset = 0.995
amplitude = 5e-3
sensitivity = "MV500"
filter_slope = "DB24"
time_constant = "MS300"
input_coupling = "AC"
input_source = "A"
input_range = "MV300"

# Documentation only: records the SR560 differential amplifier's gain (V/V)
# as set manually on the instrument (not under GPIB/software control) so it
# appears in the snapshot preamble of gas_response.csv. Does not change any
# instrument setting.
sr560_gain = 200
