[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GMOS_LIA_Setup"
version = "0.0.7"
description = "Setup to control and test GMOS gas sensor"
authors = [
  { name = "Eli Zeltser", email = "elizeltser97@gmail.com" }
]
readme = "README.rst"
requires-python = ">=3.8"

dependencies = [
  "pyvisa",
  "pyvisa-py",
  "gpib-ctypes",
  "pyserial",
  "numpy",
  "scipy",
  "matplotlib",
  "pytest",
  "ruff",
  "pyright",
  "mcp<2"
]

[project.optional-dependencies]
lint = ["ruff"]
typecheck = ["pyright"]

[tool.setuptools]
package-dir = {"" = "python/sources"}

[tool.setuptools.packages.find]
where = ["python/sources"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F"] # Basic errors and formatting; import sorting (I) is disabled —
                    # this codebase orders imports by dependency, not alphabetically.

[tool.pyright]
include = ["python"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic" # Avoids "strict" mode which is way too loud for beginners
pythonVersion = "3.12" # Matches the interpreter actually installed in .venv

# Tests use duck-typed fakes (_FakeLIA/_FakeSCU) in place of the real instrument
# wrappers, which pyright reports as type errors; relax only these rules there.
[[tool.pyright.executionEnvironments]]
root = "python/tests"
extraPaths = ["python/sources"]
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportOptionalMemberAccess = "none"
