[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GMOS_LIA_Setup"
version = "0.0.7"
description = "Setup to control and test GMOS gas sensor"
authors = [
  { name = "Eli Zeltser", email = "elizeltser97@gmail.com" }
]
readme = "README.rst"
requires-python = ">=3.8"

dependencies = [
  "pyvisa",
  "pyvisa-py",
  "gpib-ctypes",
  "pyserial",
  "numpy",
  "matplotlib",
  "pytest",
  "ruff",
  "pyright"
]

[project.optional-dependencies]
lint = ["ruff"]
typecheck = ["pyright"]

[tool.setuptools]
package-dir = {"" = "python/sources"}

[tool.setuptools.packages.find]
where = ["python/sources"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"] # Basic errors, formatting, and import sorting

[tool.pyright]
include = ["python"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic" # Avoids "strict" mode which is way too loud for beginners
pythonVersion = "3.10"
