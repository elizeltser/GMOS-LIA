# Example config for: python sources/main.py --experiment lia_readout --config configs/lia_readout.example.toml
#
# Resets and fully configures the LIA + both SCUs, then reads out X/Y/Theta
# at a single reference frequency for a duration derived from the frequency
# (tau = 1.5/f, measurement_time = 200*tau).

[ate]

[experiment]
lia_frequency = 1.0    # Hz, must be in [0.1, 40]
v_scu1 = 1.11
v_scu2 = 1.09
scu_compliance = 10e-6
offset = 2.5
amplitude = 10e-3
