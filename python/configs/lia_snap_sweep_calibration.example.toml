# Example config for: python sources/main.py --experiment lia_snap_sweep --config configs/lia_snap_sweep_calibration.example.toml
# Same as lia_snap_sweep.toml but with closed-loop bias auto-calibration
# enabled: at the start of the run (right after the first point's frequency
# is set, before `first_settle`), heater1/heater3 voltages are hill-climbed
# toward the target SCU currents below, then v_scu1/v_scu2 are fine-trimmed
# in 10uV steps. The calibrated heater/SCU voltages then carry through the
# rest of the frequency sweep.

[ate]
debug_device_io = true

[ate.heater1]
voltage = 2.75
current = 0.101

[ate.heater3]
voltage = 2.702
current = 0.098

[experiment]
duration = 240.0
sample_interval = 1.0
settle = 20.0
sweep_folder = "snap_sweep_calibrated"

first_settle = 60.0
first_auto_phase = true
first_autophase_settle = 60.0

configure_instruments = true

v_scu1 = 2.01
v_scu2 = 2.0
scu_compliance = 1e-4
offset = 0.955
amplitude = 25e-3
sensitivity = "MV500"
filter_slope = "DB24"
time_constant = "MS100"
input_coupling = "DC"
input_source = "A"
input_range = "V1"

[experiment.frequencies]
start = 100.0
stop = 10000.0
num = 40
scale = "log"

[experiment.calibration]
enabled = true
# Target SCU drain currents; heater1 is paired with SCU2's current, heater3
# with SCU1's current (cross-paired per the physical setup).
target_current_scu1 = 4.5e-6
target_current_scu2 = 4.5e-6
current_tolerance = 1e-6
final_current_tolerance = 5e-7
heater_step_voltage = 0.01
heater_min_step_voltage = 0.001
heater_settle_time = 1.0
heater_max_steps = 40
heater1_min_voltage = 2.5
heater1_max_voltage = 3.0
heater3_min_voltage = 2.5
heater3_max_voltage = 3.0
max_rounds = 5
scu_voltage_step = 10e-6
scu_settle_time = 0.5
scu_max_steps = 200
