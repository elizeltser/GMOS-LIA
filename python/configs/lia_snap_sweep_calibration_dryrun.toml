# Dry-run config for: python sources/main.py --experiment lia_snap_sweep --config configs/lia_snap_sweep_calibration_dryrun.toml
# Same as lia_snap_sweep_calibration.example.toml (closed-loop bias
# auto-calibration enabled) but trimmed down for a *fast* first look at the
# calibration log on real hardware: only 2 frequency points, short captures,
# and short settle times everywhere. NOT tuned for real thermal accuracy —
# once the log looks sane, switch run_experiment.sh back to
# lia_snap_sweep_calibration.example.toml (or lia_snap_sweep.toml with
# calibration.enabled=true) for a real run with proper settle times.

[ate]
debug_device_io = true

[ate.heater1]
voltage = 2.75
current = 0.101

[ate.heater3]
voltage = 2.702
current = 0.098

[experiment]
duration = 5.0
sample_interval = 1.0
settle = 5.0
sweep_folder = "snap_sweep_calibration_dryrun"

# Shortened just to see the calibration log quickly; a real run should keep
# first_settle=60.0 for proper thermal settling.
first_settle = 5.0
first_auto_phase = true
first_autophase_settle = 5.0

configure_instruments = true

v_scu1 = 2.01
v_scu2 = 2.0
scu_compliance = 1e-4
offset = 0.955
amplitude = 25e-3
sensitivity = "MV500"
filter_slope = "DB24"
input_coupling = "DC"
input_source = "A"
input_range = "V1"

[experiment.frequencies]
start = 100.0
stop = 1000.0
num = 2
scale = "log"

[experiment.calibration]
enabled = true
target_current_scu1 = 4.5e-6
target_current_scu2 = 4.5e-6
current_tolerance = 1e-6
final_current_tolerance = 5e-7
heater_step_voltage = 0.01
heater_min_step_voltage = 0.001
# Real thermal settle is ~1s minimum; kept short here just to see step-by-step
# log output quickly rather than to actually reach a stable target.
heater_settle_time = 1.0
heater_max_steps = 5
heater1_min_voltage = 2.5
heater1_max_voltage = 3.0
heater3_min_voltage = 2.5
heater3_max_voltage = 3.0
max_rounds = 2
scu_voltage_step = 10e-6
scu_settle_time = 0.5
scu_max_steps = 10
